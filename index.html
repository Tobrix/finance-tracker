<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj Finanční Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Hlavička s nahráváním -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Měsíční Cash Flow</h1>
                <p class="text-sm text-gray-500">Data zůstávají pouze ve tvém prohlížeči</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-4">
                <button onclick="clearData()" class="px-4 py-2 text-sm text-red-600 border border-red-200 rounded-lg hover:bg-red-50 transition-colors">Vymazat data</button>
                <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium transition-colors shadow-sm">
                    Nahrát CSV z banky
                    <input type="file" accept=".csv" class="hidden" id="csvUpload">
                </label>
            </div>
        </header>

        <!-- Hlavní ukazatele -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-[#82ca9d]">
                <h3 class="text-sm font-medium text-gray-500 mb-1">Celkem příjmy</h3>
                <p class="text-2xl font-bold text-gray-900" id="totalIncome">0 Kč</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-[#fca5a5]">
                <h3 class="text-sm font-medium text-gray-500 mb-1">Celkem výdaje</h3>
                <p class="text-2xl font-bold text-gray-900" id="totalExpense">0 Kč</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-[#38bdf8]">
                <h3 class="text-sm font-medium text-gray-500 mb-1">Celkem investice</h3>
                <p class="text-2xl font-bold text-gray-900" id="totalInvest">0 Kč</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-[#fbbf24]">
                <h3 class="text-sm font-medium text-gray-500 mb-1">Volné prostředky</h3>
                <p class="text-2xl font-bold text-gray-900" id="totalFree">0 Kč</p>
            </div>
        </div>

        <!-- Grafy -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="font-semibold text-gray-700 mb-4">Poměr výdajů dle kategorií</h3>
                <div class="relative h-64 w-full flex justify-center">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="font-semibold text-gray-700 mb-4">Cash Flow Přehled</h3>
                <div class="relative h-64 w-full flex justify-center">
                    <canvas id="cashflowChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Tabulka transakcí -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 bg-gray-50 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-semibold text-gray-700">Poslední transakce</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-full">
                    <thead class="bg-white border-b border-gray-100">
                        <tr>
                            <th class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Datum</th>
                            <th class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Obchodník / Zpráva</th>
                            <th class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Kategorie</th>
                            <th class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right">Částka (CZK)</th>
                        </tr>
                    </thead>
                    <tbody id="transactionList" class="divide-y divide-gray-50 text-sm">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('myFinances')) || [];
        let expenseChartObj = null;
        let cashflowChartObj = null;

        const categorizationRules = [
            { cat: 'Výplata / Příjem', type: 'in', keywords: ['pikly', 'výplata', 'mzda'] },
            { cat: 'Převody od Petry', type: 'in', keywords: ['petra', 'faldíková', 'peťka'] },
            { cat: 'Investice', type: 'inv', keywords: ['trading 212', 'coinmate', 'portu', 'wood & company'] },
            { cat: 'Předplatné', type: 'out', keywords: ['spotify', 'herohero', 'claude', 'apple', 'apple.com', 'distrokid'] },
            { cat: 'Potraviny', type: 'out', keywords: ['lidl', 'kaufland', 'tesco', 'albert', 'hruska'] },
            { cat: 'Restaurace', type: 'out', keywords: ['mcdonald', 'kfc', 'kebab', 'palac food', 'fruitisimo', 'foodora'] },
            { cat: 'Online nákupy', type: 'out', keywords: ['temu', 'aliexpress', 'allegro', 'oopbuy', 'agoda', 'vinted'] },
            { cat: 'Auto / Doprava', type: 'out', keywords: ['csad', 'dpo', 'parking', 'lkq', 'rekola', 'parken', 'eurooil', 'transdev', 'idos'] },
            { cat: 'Oblečení / Kosmetika', type: 'out', keywords: ['nam hair', 'nyx', 'very goodies', 'verygoodies'] },
            { cat: 'Hry / Zábava', type: 'out', keywords: ['itch.io', 'steamgames'] },
            { cat: 'Spoření', type: 'inv', keywords: ['spořicí', 'vklad hotovosti'] }
        ];

        function categorizeTransaction(text, amount) {
            let lowerText = (text || '').toLowerCase();
            
            for (let rule of categorizationRules) {
                if (rule.keywords.some(kw => lowerText.includes(kw))) {
                    return { category: rule.cat, type: rule.type };
                }
            }
            
            if (amount > 0) return { category: 'Ostatní příchozí', type: 'in' };
            return { category: 'Ostatní výdaje', type: 'out' };
        }

        document.getElementById('csvUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                encoding: "UTF-8",
                complete: function(results) {
                    const newTx = [];
                    results.data.forEach(row => {
                        const rawAmount = row['Zaúčtovaná částka'];
                        if (!rawAmount) return; 
                        
                        const amount = parseFloat(rawAmount.replace(/\s/g, '').replace(',', '.'));
                        
                        // Sloučení textů pro přesnější záchyt kategorií
                        const obchodnik = row['Název obchodníka'] || '';
                        const protiucet = row['Název protiúčtu'] || '';
                        const zprava = row['Zpráva'] || '';
                        
                        const fullContext = `${obchodnik} ${protiucet} ${zprava}`.trim();
                        const displayNote = obchodnik || protiucet || zprava || 'Neznámá platba';
                        const date = row['Datum provedení'] || new Date().toLocaleDateString('cs-CZ');

                        if (!isNaN(amount) && amount !== 0) {
                            const { category, type } = categorizeTransaction(fullContext, amount);
                            newTx.push({ date, note: displayNote, category, type, amount });
                        }
                    });

                    transactions = [...newTx, ...transactions];
                    localStorage.setItem('myFinances', JSON.stringify(transactions));
                    updateDashboard();
                }
            });
        });

        function clearData() {
            if(confirm('Opravdu vymazat všechna data?')) {
                transactions = [];
                localStorage.removeItem('myFinances');
                updateDashboard();
            }
        }

        function getCategoryColor(type) {
            if (type === 'in') return 'bg-[#82ca9d] text-white';
            if (type === 'inv') return 'bg-[#38bdf8] text-white';
            return 'bg-[#fca5a5] text-white';
        }

        function updateDashboard() {
            let inTotal = 0, outTotal = 0, invTotal = 0;
            let expenseByCategory = {};

            const tbody = document.getElementById('transactionList');
            tbody.innerHTML = '';

            transactions.forEach(tx => {
                if (tx.type === 'in') inTotal += tx.amount;
                else if (tx.type === 'inv') invTotal += Math.abs(tx.amount);
                else {
                    outTotal += Math.abs(tx.amount);
                    expenseByCategory[tx.category] = (expenseByCategory[tx.category] || 0) + Math.abs(tx.amount);
                }

                const tr = document.createElement('tr');
                const textColor = tx.amount < 0 ? 'text-red-600' : 'text-emerald-600';
                
                tr.innerHTML = `
                    <td class="py-3 px-4 whitespace-nowrap text-gray-500">${tx.date}</td>
                    <td class="py-3 px-4 text-gray-900 truncate max-w-xs">${tx.note}</td>
                    <td class="py-3 px-4">
                        <span class="text-xs px-2.5 py-1 rounded-full font-medium shadow-sm ${getCategoryColor(tx.type)}">${tx.category}</span>
                    </td>
                    <td class="py-3 px-4 font-medium text-right ${textColor}">${tx.amount.toLocaleString('cs-CZ', {minimumFractionDigits: 2})} Kč</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalIncome').innerText = inTotal.toLocaleString('cs-CZ', {minimumFractionDigits: 2}) + ' Kč';
            document.getElementById('totalExpense').innerText = outTotal.toLocaleString('cs-CZ', {minimumFractionDigits: 2}) + ' Kč';
            document.getElementById('totalInvest').innerText = invTotal.toLocaleString('cs-CZ', {minimumFractionDigits: 2}) + ' Kč';
            document.getElementById('totalFree').innerText = (inTotal - outTotal - invTotal).toLocaleString('cs-CZ', {minimumFractionDigits: 2}) + ' Kč';

            updateCharts(inTotal, outTotal, invTotal, expenseByCategory);
        }

        function updateCharts(inTotal, outTotal, invTotal, expenseByCategory) {
            const ctxEx = document.getElementById('expenseChart').getContext('2d');
            if (expenseChartObj) expenseChartObj.destroy();
            
            expenseChartObj = new Chart(ctxEx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(expenseByCategory),
                    datasets: [{
                        data: Object.values(expenseByCategory),
                        backgroundColor: ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#2dd4bf', '#a78bfa', '#f472b6', '#38bdf8', '#818cf8'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });

            const ctxCf = document.getElementById('cashflowChart').getContext('2d');
            if (cashflowChartObj) cashflowChartObj.destroy();

            cashflowChartObj = new Chart(ctxCf, {
                type: 'bar',
                data: {
                    labels: ['Příjmy', 'Výdaje', 'Investice', 'Zůstatek'],
                    datasets: [{
                        data: [inTotal, outTotal, invTotal, (inTotal - outTotal - invTotal)],
                        backgroundColor: ['#82ca9d', '#fca5a5', '#38bdf8', '#fbbf24'],
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        updateDashboard();
    </script>
</body>
</html>
